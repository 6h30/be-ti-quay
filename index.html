/* ====== BÉ TÍ QUẬY – khung game v0.1 ======

];

 {k:'speed',n:'Bò nhanh hơn',e:'💨',base:60,d:l=>`+${l*12}% tốc độ bò`},

const EVENTS=[

   Thử ngay: mở index.html?event=noel hoặc ?event=tet */
const TET={2027:[2,6],2028:[1,26],2029:[2,13],2030:[2,3]};
const SEASONS=[
 {id:'noel',n:'Giáng Sinh An Lành',e:'🎄',d:'Tuyết rơi khắp nhà! Xu thưởng ×1.25, đồ vàng nhiều hơn. Phá quà nhận mũ Ông già Noel!',mods:{coinX:1.25,goldT:.6},hat:'🎅',hatN:'Mũ Ông già Noel',T:[150,400,800],R:[250,500,1000],
  theme:{kind:'snow',tint:'rgba(255,60,60,.10)',flags:['#ff5a5a','#ffffff','#4cc36b','#ffffff'],hat:'🎅',floaty:['❄️','🎄','🎁','⛄','⭐'],

 {id:'tet',n:'Tết Đoàn Viên',e:'🧧',d:'Lì xì khắp nhà! Xu thưởng ×1.5, combo giữ lâu hơn, đồ vàng nhiều hơn. Nhận mũ Dê Vàng!',mods:{coinX:1.5,goldT:.5,win:.5},hat:'🐐',hatN:'Mũ Dê Vàng',T:[150,400,800],R:[300,600,1200],

let EV_T=[100,250,450],EV_R=[150,350,500],EVLEFT=7;

function weekInfo(){const d=new Date(),mid=new Date(d.getFullYear(),d.getMonth(),d.getDate()),days=Math.round((mid-new Date(2024,0,1))/864e5);return{idx:Math.floor(days/7),left:7-days%7};}
function todayMid(){const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
function activeSeason(){
 const f=new URLSearchParams(location.search).get('event'),m=todayMid(),y=m.getFullYear();
 if(f){const sn=SEASONS.find(x=>x.id===f);if(sn)return{s:sn,end:new Date(+m+9*864e5),key:'forced-'+f};}
 const nS=new Date(y,11,15),nE=new Date(y,11,31);if(m>=nS&&m<=nE)return{s:SEASONS[0],end:nE,key:'noel'+y};
 for(const yy of [y-1,y,y+1]){const t=TET[yy];if(!t)continue;const tet=new Date(yy,t[0]-1,t[1]),a=new Date(+tet-14*864e5),b=new Date(+tet+8*864e5);if(m>=a&&m<=b)return{s:SEASONS[1],end:b,key:'tet'+yy};}
 return null;}
function checkWeek(){
 const w=weekInfo(),as=activeSeason();let key,ev,left;
 if(as){key=as.key;ev=as.s;left=Math.max(1,Math.round((as.end-todayMid())/864e5)+1);}else{key=w.idx;ev=EVENTS[w.idx%EVENTS.length];left=w.left;}
 EV_T=ev.T||[100,250,450];EV_R=ev.R||[150,350,500];
 if(!S.week||S.week.id!==key){S.week={id:key,broken:0,claimed:[false,false,false]};track('new_week',{ev:ev.id});}

/* track(): nơi gắn analytics thật (Firebase/GA…). Hiện chỉ lưu 300 sự kiện cuối để phân tích hành vi. */
function track(n,p){S.log.push({t:Date.now(),n,p});if(S.log.length>300)S.log.shift();}
const dayKey=(d=new Date())=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
function seedRng(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;}
 return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return((h^=h>>>16)>>>0)/4294967296;};}
function genMissions(day){const r=seedRng(day),pool=MPOOL.slice(),out=[];
 while(out.length<3&&pool.length){const m=pool.splice(Math.floor(r()*pool.length),1)[0];if(out.some(o=>o.k===m.k))continue;
  out.push({k:m.k,t:m.t,r:m.r,x:m.x.replace('{t}',m.t),p:0,claimed:false});}return out;}
function checkDaily(){const t=dayKey();
 if(S.lastDay!==t){const y=new Date();y.setDate(y.getDate()-1);S.streak=(S.lastDay===dayKey(y))?S.streak+1:1;S.lastDay=t;track('new_day',{streak:S.streak});}
 if(S.mDay!==t){S.mDay=t;S.missions=genMissions(t);}checkWeek();save();}
function addProg(k,n,max){S.missions.forEach(m=>{if(m.k!==k)return;m.p=Math.min(m.t,max?Math.max(m.p,n):m.p+n);});}

/* ---------- AUDIO ----------
   Mặc định: nhạc & hiệu ứng tổng hợp bằng WebAudio (không cần file).
   Có file thật thì ưu tiên: assets/audio/<tên>.mp3  (xem assets/PROMPTS.md mục Âm thanh). */
let AC,MG,SG,NOISE;
const AUD={},AUD_NAMES=['sfx_break','sfx_pop','sfx_coin','sfx_steps','sfx_caught','sfx_ok','sfx_gold','sfx_bark','sfx_meow','sfx_crash','sfx_giggle','music_game'];
function ac(){
 if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();SG=AC.createGain();MG.connect(AC.destination);SG.connect(AC.destination);
  const n=Math.floor(AC.sampleRate*.6),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;NOISE=b;
  loadAudio();musicStart();}catch(e){AC=null;}}
 if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type='sine',v=.12,slide=0,dest,at=0){const a=ac();if(!a)return;const t0=a.currentTime+at,o=a.createOscillator(),g=a.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+d);
 g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(dest||SG);o.start(t0);o.stop(t0+d+.02);}
function noise(d,v,hp=2000,dest,at=0){const a=ac();if(!a||!NOISE)return;const t0=a.currentTime+at,s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
 s.buffer=NOISE;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);
 s.connect(f);f.connect(g);g.connect(dest||SG);s.start(t0);s.stop(t0+Math.min(d,.55));}
function loadAudio(){AUD_NAMES.forEach(n=>{fetch('assets/audio/'+n+'.mp3').then(r=>r.ok?r.arrayBuffer():Promise.reject()).then(b=>AC.decodeAudioData(b))
 .then(buf=>{AUD[n]=buf;if(n==='music_game'){clearInterval(mus.timer);mus.timer=null;musicStart();}}).catch(()=>{});});}
function playBuf(n,dest,loop){const s=AC.createBufferSource();s.buffer=AUD[n];s.loop=!!loop;s.connect(dest||SG);s.start();return s;}
const SFX={
 break:()=>{noise(.35,.22,3000);tone(1200,.12,'square',.06,-700);tone(2200,.08,'triangle',.05,-1500,0,.04);tone(250,.25,'sawtooth',.06,-150);},
 pop:()=>tone(420,.12,'sine',.18,260),
 coin:()=>{tone(880,.08,'square',.07);tone(1320,.12,'square',.07,0,0,.07);},
 steps:()=>[0,.25,.5,.75].forEach(d=>tone(110,.1,'triangle',.28,0,0,d)),
 caught:()=>{tone(220,.5,'sawtooth',.14,-140);noise(.2,.1,800);},
 ok:()=>{tone(660,.1,'sine',.15);tone(990,.2,'sine',.15,0,0,.1);},
 gold:()=>[0,1,2,3].forEach(i=>tone(700+i*220,.15,'square',.07,0,0,i*.08)),
 bark:()=>{tone(430,.12,'sawtooth',.14,-220);tone(400,.14,'sawtooth',.14,-200,0,.2);},
 meow:()=>{tone(450,.18,'sine',.15,350);tone(800,.25,'sine',.13,-400,0,.18);},
 crash:()=>{noise(.5,.4,200);tone(110,.4,'sawtooth',.2,-60);tone(1500,.1,'square',.05,-1000,0,.05);},
 giggle:()=>[0,1,2,3].forEach(i=>tone(700+i*120,.07,'sine',.09,150,0,i*.09))};
function sfx(n){try{if(!S.sound||!ac())return;if(AUD['sfx_'+n]){playBuf('sfx_'+n);return;}SFX[n]&&SFX[n]();}catch(e){}}
/* nhạc nền: bước 16 nấc/ô nhịp, 2 ô nhịp; chế độ căng thẳng khi mẹ sắp tới */
const mus={step:0,next:0,tense:false,timer:null,src:null};
const NOTE=n=>261.63*Math.pow(2,n/12);
const HAPPY=[[0,null,4,null,7,null,4,null,9,null,7,null,4,null,2,null],[7,null,9,null,11,null,9,null,12,null,9,null,7,null,4,null]];
const HB=[[-12,-12,-7,-7],[-5,-5,-7,-12]];
const TENSE=[0,null,1,null,0,null,-1,null,0,null,3,null,1,null,0,null];
function musicStart(){
 if(!AC||mus.timer||mus.src)return;
 if(AUD.music_game){mus.src=playBuf('music_game',MG,true);return;}
 mus.next=AC.currentTime+.1;mus.timer=setInterval(musicTick,40);}
function musicTick(){
 if(!AC)return;
 while(mus.next<AC.currentTime+.2){
  const st=mus.step%32,bar=st>>4,i=st&15,T=mus.tense,sd=T?60/165/2:60/128/2,at=Math.max(0,mus.next-AC.currentTime);
  const L=T?TENSE[i]:HAPPY[bar][i];
  if(L!=null)tone(NOTE(L+12),sd*1.6,T?'sawtooth':'square',T?.05:.045,0,MG,at);
  if(!T&&i%4===0)tone(NOTE(HB[bar][i/4]),sd*3.5,'triangle',.12,0,MG,at);
  if(T&&i%2===0)tone(NOTE(-24),sd*1.5,'sawtooth',.09,0,MG,at);
  if(i%2===1)noise(.04,T?.05:.03,7000,MG,at);
  mus.next+=sd;mus.step++;}}
function audioMix(){
 if(!AC)return;mus.tense=!!(G&&G.running&&G.mom.state!=='away');
 MG.gain.setTargetAtTime(S.music?(screen===null?.9:.5):0,AC.currentTime,.15);SG.gain.setTargetAtTime(S.sound?1:0,AC.currentTime,.05);}

function toggleMusic(){S.music=!S.music;$('#mus').textContent=S.music?'🎵':'🔕';save();ac();}

 it.vx=dir*rnd(70,150);it.vy=-160;it.vr=dir*rnd(3,7);it.q=false;sfx('pop');if(!chain&&Math.random()<.35)sfx('giggle');G.shake=Math.max(G.shake,4);

 G.score+=pts;G.broken++;S.week.broken++;G.shake=it.gold?16:10;sfx(it.gold?'gold':'break');

 if(G.mess.length<50)for(let i=0;i<3;i++)G.mess.push({x:it.x+rnd(-26,26),y:FLOORY+rnd(-4,8),c:['#e0cfa8','#c8b88e','#f0e4c8'][i],r:rnd(3,7)});
 addProg('break',1);addProg('item:'+it.t,1);addProg('combo',G.combo,true);if(it.gold){G.golds++;addProg('gold',1);}

function updateBaby(dt){
 const b=G.baby;
 if(b.stun>0){b.stun-=dt;b.state='stun';G.innocent=false;return;}
 const inn=G.hold&&!G.exhausted&&G.meter>0;G.innocent=inn;
 if(inn){b.state='innocent';G.meter=Math.max(0,G.meter-26*dt);if(G.meter<=0)G.exhausted=true;return;}
 G.meter=Math.min(maxMeter(),G.meter+16*dt);if(!G.hold&&G.meter>15)G.exhausted=false;
 if(b.state==='act'){b.at-=dt;if(b.at<=0){const it=b.item;b.state='idle';b.item=null;if(it){it.q=false;if(it.state==='idle')knock(it,false);}}return;}
 while(b.q.length&&b.q[0].state!=='idle'){b.q.shift().q=false;}
 const tx=b.q.length?b.q[0].x:b.tx,dx=tx-b.x,sp=230*(1+.12*S.up.speed);
 if(Math.abs(dx)>6){b.dir=dx>0?1:-1;b.x+=Math.sign(dx)*Math.min(Math.abs(dx),sp*dt);b.state='move';}
 else if(b.q.length){const it=b.q.shift();b.item=it;b.state='act';b.at=.25+(FLOORY-it.hy)/900*.5;b.dir=it.x>=b.x?1:-1;}
 else b.state='idle';
}

function spawnPest(){
 const types=['cat','dog','dad'].filter(x=>x!==G.lastPest),type=types[Math.floor(Math.random()*types.length)];
 if(type==='cat'){
  const ps=G.room.plats.filter(p=>G.items.some(it=>it.state==='idle'&&it.hy===p.y&&it.hx>=p.x&&it.hx<=p.x+p.w));
  if(!ps.length)return;const p=ps[Math.floor(Math.random()*ps.length)];

 }else if(type==='dog'){G.pest={type,x:-50,y:FLOORY+10,dir:1,ph:'in',t:0,tx:rnd(150,380)};}
 else{G.pest={type,x:W+40,y:FLOORY+10,dir:-1,ph:'walk',t:0,rot:0};toast('👨 Bố vừa đi vừa xem điện thoại – chạm để làm bố vấp!');}

function updatePest(dt){
 if(!G.pest){G.pestT-=dt;if(G.pestT<=0&&G.mom.state==='away'&&G.mom.t>5){G.pestT=rnd(14,22)*evMod('pestT',1);spawnPest();}return;}
 const p=G.pest;p.t+=dt;
 const go=(tx,sp)=>{const d=tx-p.x;p.dir=d>=0?1:-1;p.x+=Math.sign(d)*Math.min(Math.abs(d),sp*dt);return Math.abs(tx-p.x)<2;};
 if(p.type==='cat'){
  if(p.ph==='in'){if(go(p.tx,170)){p.ph='jump';p.t=0;}}
  else if(p.ph==='jump'){const k=Math.min(1,p.t/.45);p.y=FLOORY+10+(p.plat.y-14-(FLOORY+10))*k-Math.sin(k*Math.PI)*50;if(k>=1){p.ph='act';p.t=0;}}
  else if(p.ph==='act'&&p.t>.7){
   const c=G.items.filter(it=>it.state==='idle'&&it.hy===p.plat.y).sort((a,b)=>Math.abs(a.x-p.x)-Math.abs(b.x-p.x))[0];
   if(c){p.dir=c.x>=p.x?1:-1;knock(c,true);float(c.x,c.y-60,'Meo~! 😼','#ffb3e6',28);sfx('meow');}p.ph='wait';p.t=0;}
  else if(p.ph==='wait'&&p.t>.6){p.ph='down';p.t=0;}
  else if(p.ph==='down'){const k=Math.min(1,p.t/.4);p.y=p.plat.y-14+((FLOORY+10)-(p.plat.y-14))*k;if(k>=1)p.ph='out';}
  else if(p.ph==='out'){p.dir=1;p.x+=220*dt;if(p.x>W+60)G.pest=null;}
 }else if(p.type==='dog'){
  if(p.ph==='in'){if(go(p.tx,210)){p.ph='bark';p.t=0;sfx('bark');toast('🐕 Chó sắp sủa! Chạm vào chó để dỗ!');}}
  else if(p.ph==='bark'&&p.t>1.8){sfx('bark');callMom(1.2);float(p.x,FLOORY-150,'Mẹ nghe thấy rồi!','#ff8080',28);G.shake=12;p.ph='out';}
  else if(p.ph==='happy'&&p.t>.8)p.ph='out';
  else if(p.ph==='out'){p.dir=-1;p.x-=230*dt;if(p.x<-70)G.pest=null;}
 }else{
  if(p.ph==='walk'){p.x-=75*dt;if(p.x<-70)G.pest=null;}
  else if(p.ph==='fall'){p.rot=Math.min(1.5,p.rot+dt*6);if(p.t>1.4)G.pest=null;}
 }
}

 updateFx(dt);

 if(fall){txt('💫',0,-212,34,'#000');ctx.beginPath();ctx.arc(0,-154,7,0,7);ctx.stroke();}
 else{[-13,13].forEach(x=>{ctx.beginPath();ctx.moveTo(x-7,-178);ctx.lineTo(x+7,-178);ctx.stroke();ctx.fillStyle='#3b2418';ctx.beginPath();ctx.arc(x,-172,3,0,7);ctx.fill();});ctx.beginPath();ctx.arc(0,-154,5,0,7);ctx.stroke();}
 ctx.fillStyle='rgba(90,58,34,.35)';for(let i=0;i<6;i++){ctx.beginPath();ctx.arc(-12+i*5,-146+(i%2)*3,1.6,0,7);ctx.fill();}
 txt('🍽️',-34,-92,34,'#000');
}
function drawMom(){
 const m=G.mom;if(m.state==='away')return;
 if(m.state==='warn'){ctx.fillStyle='rgba(255,230,150,'+(.4+.3*Math.sin(G.t*14))+')';rr(462,610,76,190,6);ctx.fill();
  txt('❗',500,570+Math.sin(G.t*14)*5,52,'#000');return;}
 const im=IMG[m.state==='scold'?'mom_angry':'mom_calm'];
 if(im)ctx.drawImage(im,m.x-90,FLOORY-300,180,330);else drawMomBody(m);
 ctx.fillStyle='#fff';ctx.strokeStyle='#ff8fc7';ctx.lineWidth=4;rr(m.x-215,FLOORY-400,235,56,22);ctx.fill();ctx.stroke();
 txt(m.said,m.x-97,FLOORY-372,m.state==='scold'?26:18,'#d63d85','center');
}
function render(t){
 const room=G?G.room:ROOMS[roomIdx];
 ctx.save();if(G&&G.shake>0)ctx.translate(rnd(-G.shake,G.shake)*.5,rnd(-G.shake,G.shake)*.5);
 drawBG(room);drawPlats(room);if(EV.theme)drawAmbient(t);
 if(G){G.mess.forEach(m=>{ctx.fillStyle=m.c;ctx.beginPath();ctx.arc(m.x,m.y,m.r,0,7);ctx.fill();});
  G.items.forEach(drawItem);
  if(!G.running&&screen==='menu'){ctx.save();ctx.translate(270,FLOORY);ctx.scale(1.5,1.5);ctx.translate(-270,-FLOORY-190/1.5);drawBaby(G.baby,t);ctx.restore();}else drawBaby(G.baby,t);drawPest();drawMom();
  G.parts.forEach(p=>{ctx.fillStyle=p.c;ctx.globalAlpha=Math.min(1,p.life*2);ctx.beginPath();ctx.arc(p.x,p.y,p.s*.6,0,7);ctx.fill();});ctx.globalAlpha=1;
  G.floats.forEach(f=>{ctx.globalAlpha=Math.max(0,1-f.t/1.2);txt(f.txt,f.x,f.y,f.s,f.c,'center','#4a1a5a');});ctx.globalAlpha=1;}
 ctx.restore();
 if(G&&G.running)hud();
}
function hud(){
 const m=G.mom;
 if(m.state==='warn'||m.state==='here'){ctx.fillStyle='rgba(255,0,0,'+(.12+.1*Math.sin(G.t*12))+')';ctx.fillRect(0,0,W,H);
  txt(m.state==='warn'?'👣 MẸ SẮP TỚI! GIỮ NÚT NGÂY THƠ!':'GIỮ NGUYÊN! 😇',W/2,175,26,'#fff','center','#b00');
  if(m.state==='here'){ctx.fillStyle='rgba(0,0,0,.35)';rr(140,195,260,12,6);ctx.fill();ctx.fillStyle='#ff5252';rr(140,195,260*Math.max(0,m.t/3.4),12,6);ctx.fill();}}
 txt('⭐ '+fmt(G.score),20,50,34,'#fff','left','#d63d85');
 txt(EV.e+' '+EV.n,W/2,84,17,'#ffe9a8','center','#d63d85');
 if(G.combo>1){const mu=1+Math.min(G.combo-1,10)*.25;txt('COMBO '+G.combo+'  x'+mu.toFixed(2),20,92,24,'#ffe14d','left','#7a3b00');
  ctx.fillStyle='rgba(0,0,0,.3)';rr(20,106,150,10,5);ctx.fill();ctx.fillStyle='#ffe14d';rr(20,106,150*Math.max(0,G.comboT/comboWindow()),10,5);ctx.fill();}
 txt(Math.max(0,Math.ceil(G.time))+'s',W/2,50,40,G.time<10?'#ff5252':'#fff','center','#d63d85');
 for(let i=0;i<3;i++)txt(i<G.lives?'❤️':'🖤',W-100+i*38,52,30,'#000');
 ctx.fillStyle='rgba(0,0,0,.35)';rr(110,852,320,12,6);ctx.fill();
 ctx.fillStyle=G.exhausted?'#999':'#6fe3ff';rr(110,852,320*G.meter/maxMeter(),12,6);ctx.fill();txt('😇',90,858,24,'#000');
 if(G.bannerT>0&&G.banner)txt(G.banner,W/2,330,52*Math.min(1,1.6-G.bannerT*.6),'#fff','center','#e0359a');
 if(!S.tut&&G.tutT>0){txt('👆 Chạm đồ vật để bé phá!',W/2,250,28,'#fff','center','#d63d85');txt('Mẹ tới → GIỮ nút xanh bên dưới',W/2,286,22,'#ffe14d','center','#d63d85');
  if(G.tutT<7.5&&G.broken>=3){S.tut=true;save();}}
}

/* ---------- INPUT ---------- */
function toCanvas(e){const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height];}
$('#stage').addEventListener('pointerdown',e=>{
 if(!G||!G.running||G.ending>0||e.target.closest('button'))return;ac();
 const[x,y]=toCanvas(e),b=G.baby;
 if(tapPest(x,y))return;
 for(let i=G.items.length-1;i>=0;i--){const it=G.items[i];
  if(it.state==='idle'&&!it.q&&Math.abs(x-it.x)<34&&y>it.y-64&&y<it.y+12){if(b.q.length<4){b.q.push(it);it.q=true;}return;}}
 if(y>760&&b.q.length===0)b.tx=Math.max(30,Math.min(W-30,x));
});
const bi=$('#btnInn');
bi.addEventListener('pointerdown',e=>{e.preventDefault();ac();if(G&&G.running){G.hold=true;bi.classList.add('down');}});
['pointerup','pointercancel','pointerleave'].forEach(n=>bi.addEventListener(n,()=>{if(G)G.hold=false;bi.classList.remove('down');}));
addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&G&&G.running){e.preventDefault();G.hold=true;bi.classList.add('down');}});
addEventListener('keyup',e=>{if(e.code==='Space'&&G){G.hold=false;bi.classList.remove('down');}});

/* ---------- UI ---------- */
function show(id){document.querySelectorAll('.screen').forEach(e=>e.classList.toggle('on',e.id===id));screen=id;const sv=(id===null||id==='menu')?'block':'none';$('#snd').style.display=sv;$('#mus').style.display=sv;}
function goMenu(){G=makeG(ROOMS[roomIdx]);renderMenu();show('menu');}
function renderMenu(){
 const r=ROOMS[roomIdx],locked=!S.rooms.includes(r.id);
 $('#mCoins').textContent=fmt(S.coins);$('#mStreak').textContent=S.streak;$('#mRoom').textContent=r.n+(locked?' 🔒':'');
 (()=>{const e=document.querySelector('#menu .sub');if(e)e.textContent=EV.theme?`${EV.e} ${EV.n} – còn ${EVLEFT} ngày!`:'Bé cưng đáng yêu – phá nhà siêu đỉnh!';})();
 $('#mBest').textContent='Kỷ lục: '+fmt(S.best[r.id]||0);
 $('#mPlay').textContent=locked?`🔓 Mở khoá ${r.cost}💰`:'▶ CHƠI';
 const n=S.missions.filter(m=>m.p>=m.t&&!m.claimed).length;$('#mBadge').textContent=n?'🔴'+n:'';const ec=evClaimable();$('#eBadge').textContent=ec?'🔴'+ec:'';$('#eBtn').firstChild.textContent=EV.e+' ';
}
function cycleRoom(d){roomIdx=(roomIdx+d+ROOMS.length)%ROOMS.length;G=makeG(ROOMS[roomIdx]);renderMenu();}
function playBtn(){ac();const r=ROOMS[roomIdx];
 if(!S.rooms.includes(r.id)){if(S.coins<r.cost){toast('Chưa đủ xu! Chơi thêm nhé 💰');return;}S.coins-=r.cost;S.rooms.push(r.id);save();renderMenu();toast('Đã mở '+r.n+'!');return;}
 startRound();}
function closeTo(){renderMenu();show('menu');}
const back='<button class="btn sm sec" style="float:right" onclick="closeTo()">✖ Đóng</button>';
let shopTab='up';
function openShop(t){shopTab=t||shopTab;const P=$('#shop');let h=back+'<h2>🛒 Cửa hàng</h2><div class="row" style="justify-content:flex-start;margin-bottom:8px"><span class="chip" style="background:#c4501a">💰 '+fmt(S.coins)+'</span></div>';
 h+='<div class="tabs">'+[['up','Nâng cấp'],['hat','Trang phục'],['room','Phòng']].map(a=>`<div class="tab ${shopTab===a[0]?'on':''}" onclick="openShop('${a[0]}')">${a[1]}</div>`).join('')+'</div>';
 if(shopTab==='up')UPS.forEach(u=>{const l=S.up[u.k],c=upCost(u,l);
  h+=`<div class="card"><span class="e">${u.e}</span><div class="t">${u.n} <small>Cấp ${l}/5 · ${l?u.d(l):'Chưa nâng'}${l<5?' → '+u.d(l+1):''}</small></div>${l>=5?'<b>MAX</b>':`<button class="btn sm" ${S.coins<c?'disabled':''} onclick="buyUp('${u.k}')">${c}💰</button>`}</div>`;});
 if(shopTab==='hat'){h+=`<div class="card"><span class="e">👶</span><div class="t">Không đội gì</div><button class="btn sm sec" onclick="equip('none')">${S.hat==='none'?'Đang dùng':'Chọn'}</button></div>`;
  HATS.forEach(x=>{const own=S.hats.includes(x.id);
   h+=`<div class="card"><span class="e">${x.e}</span><div class="t">${x.n}</div>${own?`<button class="btn sm sec" onclick="equip('${x.id}')">${S.hat===x.id?'Đang dùng':'Chọn'}</button>`:(x.c?`<button class="btn sm" ${S.coins<x.c?'disabled':''} onclick="buyHat('${x.id}')">${x.c}💰</button>`:'<b>🔒</b>')}</div>`;});}
 if(shopTab==='room')ROOMS.forEach((r,i)=>{const own=S.rooms.includes(r.id);
  h+=`<div class="card"><span class="e">🏠</span><div class="t">${r.n}<small>Kỷ lục ${fmt(S.best[r.id]||0)}</small></div>${own?'<b>✔</b>':`<button class="btn sm" ${S.coins<r.cost?'disabled':''} onclick="buyRoom(${i})">${r.cost}💰</button>`}</div>`;});
 P.innerHTML=h;show('shop');}
const upCost=(u,l)=>Math.round(u.base*Math.pow(l+1,1.6)/5)*5;
function buyUp(k){const u=UPS.find(a=>a.k===k),c=upCost(u,S.up[k]);if(S.coins<c||S.up[k]>=5)return;S.coins-=c;S.up[k]++;sfx('coin');track('buy_up',{k,l:S.up[k]});save();openShop();}
function buyHat(id){const x=HATS.find(a=>a.id===id);if(S.coins<x.c)return;S.coins-=x.c;S.hats.push(id);S.hat=id;sfx('coin');save();openShop();}
function equip(id){S.hat=id;save();openShop();}
function buyRoom(i){const r=ROOMS[i];if(S.coins<r.cost)return;S.coins-=r.cost;S.rooms.push(r.id);sfx('coin');save();openShop();}
function openMissions(){let h=back+'<h2>📋 Nhiệm vụ hôm nay</h2><div class="sub" style="color:#8a6a50">Quay lại mỗi ngày để nhận quà & nhiệm vụ mới!</div>';
 h+='<div class="days">'+DAILY.map((r,i)=>{const cur=(S.streak-1)%7;return`<div class="day ${i===cur?'cur':(i<cur?'past':'')}">Ngày ${i+1}<br>💰${r}</div>`;}).join('')+'</div>';
 S.missions.forEach((m,i)=>{const ok=m.p>=m.t;h+=`<div class="card"><div class="t">${m.x}<div class="bar"><i style="width:${m.p/m.t*100}%"></i></div><small>${m.p}/${m.t}</small></div>${m.claimed?'<b>✔</b>':`<button class="btn sm" ${ok?'':'disabled'} onclick="claimM(${i})">+${m.r}💰</button>`}</div>`;});
 $('#missions').innerHTML=h;show('missions');}
function claimM(i){const m=S.missions[i];if(m.p<m.t||m.claimed)return;m.claimed=true;S.coins+=m.r;sfx('coin');track('mission_claim',{k:m.k});save();openMissions();}
function openAlbum(){const ks=Object.keys(ITEMS),n=ks.filter(k=>S.album[k]).length;
 let h=back+`<h2>📖 Album phá phách ${n}/${ks.length}</h2><div class="sub" style="color:#8a6a50;margin-bottom:10px">Phá đủ mọi món để nhận 👑 Vương miện!</div><div class="grid">`;
 ks.forEach(k=>{const d=ITEMS[k],ok=S.album[k];h+=`<div class="cell ${ok?'':'lock'}"><b>${d.e}</b>${ok?d.n:'???'}</div>`;});
 $('#album').innerHTML=h+'</div>';show('album');}
function openEvent(){const b=S.week.broken;
 let h=back+`<h2>${EV.e} ${EV.n}</h2><div class="card"><div class="t">${EV.d}<small>Còn ${EVLEFT} ngày · Đã phá ${b} món trong tuần</small></div></div>`;
 EV_T.forEach((t,i)=>{const ok=b>=t,last=i===2;h+=`<div class="card"><span class="e">${last?EV.hat:'💰'}</span><div class="t">Phá ${t} món<div class="bar"><i style="width:${Math.min(100,b/t*100)}%"></i></div><small>${Math.min(b,t)}/${t} · +${EV_R[i]}💰${last?' + '+EV.hatN:''}</small></div>${S.week.claimed[i]?'<b>✔</b>':`<button class="btn sm" ${ok?'':'disabled'} onclick="claimEv(${i})">Nhận</button>`}</div>`;});
 $('#event').innerHTML=h+'<div class="sub" style="color:#8a6a50;margin-top:8px">'+(EV.theme?'Hết sự kiện sẽ có quà và luật chơi mới!':'Tuần sau sẽ có sự kiện mới!')+'</div>';show('event');}
function claimEv(i){if(S.week.broken<EV_T[i]||S.week.claimed[i])return;S.week.claimed[i]=true;S.coins+=EV_R[i];
 if(i===2&&!S.hats.includes('ev_'+EV.id)){S.hats.push('ev_'+EV.id);toast('Nhận '+EV.hatN+'!');}sfx('coin');track('event_claim',{ev:EV.id,i});save();openEvent();}
function openDaily(){const i=(S.streak-1)%7;
 $('#daily').innerHTML=`<h2 style="text-align:center">🎁 Quà điểm danh</h2><div style="text-align:center">Chuỗi ${S.streak} ngày liên tiếp! 🔥</div><div class="days">${DAILY.map((r,j)=>`<div class="day ${j===i?'cur':(j<i?'past':'')}">Ngày ${j+1}<br>💰${r}</div>`).join('')}</div><div class="row"><button class="btn" onclick="claimDaily()">Nhận ${DAILY[i]}💰</button></div>`;show('daily');}
function claimDaily(){S.coins+=DAILY[(S.streak-1)%7];S.claimedDay=dayKey();sfx('coin');track('daily_claim',{streak:S.streak});save();closeTo();}
function renderResult(r){
 const room=G.room,nextRoom=ROOMS.find(x=>!S.rooms.includes(x.id));
 const pend=S.missions.filter(m=>!m.claimed).sort((a,b)=>b.p/b.t-a.p/a.t)[0];
 let goal='';
 if(pend){const ok=pend.p>=pend.t;goal=ok?'🎉 Có thưởng nhiệm vụ đang chờ bạn nhận!':`📋 ${pend.x}: còn ${pend.t-pend.p}`;}
 else if(nextRoom)goal=`🏠 ${nextRoom.n}: ${fmt(S.coins)}/${nextRoom.cost}💰`;
 const nxt=room.stars.find(s=>G.score<s);
 $('#result').innerHTML=`<h2 style="text-align:center">${r.newBest?'🏆 KỶ LỤC MỚI!':'Kết quả'}</h2>
 <div style="text-align:center;font-size:calc(var(--u)*54)">${[0,1,2].map(i=>i<r.st?'⭐':'☆').join('')}</div>
 <div style="text-align:center;font-size:calc(var(--u)*46);color:#c4501a">${fmt(G.score)}</div>
 <div style="text-align:center;margin-bottom:12px;color:#8a6a50">${nxt?`Còn ${fmt(nxt-G.score)} điểm để lên sao tiếp theo`:'Đủ 3 sao rồi – siêu quậy!'}</div>
 <div class="card"><div class="t">Đồ phá được<small>Combo cao nhất x${G.bestCombo} · Bị mẹ bắt ${G.caught} lần · Ngây thơ ${G.innocentOK} lần</small></div><b>${G.broken}</b></div>
 <div class="card"><div class="t">Xu nhận được<small>Điểm ×0.1 + 20 mỗi lần ngây thơ thành công</small></div><b>+${coins(r)}💰</b></div>
 <div class="card"><div class="t">${goal||'Tiếp tục quậy nào!'}</div></div>
 ${(()=>{const i=EV_T.findIndex((t,k)=>!S.week.claimed[k]);return i<0?'':`<div class="card"><span class="e">${EV.e}</span><div class="t">${EV.n}: ${Math.min(S.week.broken,EV_T[i])}/${EV_T[i]} món<div class="bar"><i style="width:${Math.min(100,S.week.broken/EV_T[i]*100)}%"></i></div></div></div>`;})()}
 <div class="row" style="margin-top:8px"><button class="btn sm sec" id="adBtn" onclick="adDouble(${r.coins})">🎬 Xem quảng cáo: nhân đôi xu (+${r.coins}💰)</button></div>
 <div class="row" style="margin-top:14px"><button class="btn big" style="font-size:calc(var(--u)*34);padding:calc(var(--u)*14) calc(var(--u)*40)" onclick="startRound()">🔁 Chơi lại</button><button class="btn sec" onclick="goMenu()">🏠 Menu</button></div>`;
}
const coins=r=>r.coins;
/* showRewardedAd(): CHỖ GẮN SDK QUẢNG CÁO THƯỞNG (AdMob/Unity Ads) khi đóng gói app. Hiện là bản giả, cho thưởng ngay. */
function showRewardedAd(onReward){track('ad_rewarded_shown',{});toast('🎬 (Quảng cáo thử nghiệm)');setTimeout(onReward,600);}
function adDouble(n){const b=$('#adBtn');if(!b||b.disabled)return;b.disabled=true;showRewardedAd(()=>{S.coins+=n;save();sfx('coin');b.textContent='✔ Đã nhân đôi xu!';});}
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);const st=$('#stage');st.style.width=W*s+'px';st.style.height=H*s+'px';st.style.setProperty('--u',s+'px');}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));

/* ---------- LOOP ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(G&&G.running&&!document.hidden)update(dt);
 render(now/1000);audioMix();requestAnimationFrame(frame);}
load();checkDaily();fit();
roomIdx=Math.max(0,ROOMS.findIndex(r=>r.id===S.room));G=makeG(ROOMS[roomIdx]);
(()=>{const m=$('#menu'),E=EV.theme?EV.theme.floaty:['💖','⭐','🍼','🧸','🎈','🌸','🍭'];for(let i=0;i<9;i++){const e=document.createElement('span');e.className='fl';e.textContent=E[i%E.length];e.style.left=(Math.random()*90)+'%';e.style.animationDuration=(8+Math.random()*7)+'s';e.style.animationDelay='-'+(Math.random()*12)+'s';m.appendChild(e);}})();
$('#snd').textContent=S.sound?'🔊':'🔇';$('#mus').textContent=S.music?'🎵':'🔕';renderMenu();
if(S.claimedDay!==dayKey())openDaily();
requestAnimationFrame(frame);
</script></body></html>
